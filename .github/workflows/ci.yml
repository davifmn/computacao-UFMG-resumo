name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testes das visualizações (JavaScript)
        run: npm test

      - name: Exemplos em C++
        run: |
          for dir in $(find periodo-* -path '*/codigo/Makefile' -exec dirname {} \;); do
            make -C "$dir" test CXX=g++
          done

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exemplos em Python
        run: |
          for f in $(find periodo-* -path '*/codigo/*.py'); do
            echo "== $f"; python "$f"
          done
