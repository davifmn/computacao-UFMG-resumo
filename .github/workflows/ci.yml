name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testes das visualizações (JavaScript)
        run: npm test

      - name: Exemplos em C++
        run: |
          for dir in $(find periodo-* -path '*/codigo/Makefile' -exec dirname {} \;); do
            make -C "$dir" test CXX=g++
          done

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exemplos em Python
        run: |
          for f in $(find periodo-* -path '*/codigo/*.py'); do
            echo "== $f"; python "$f"
          done

  trabalhos:
    name: Trabalhos práticos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Algoritmos I · TP3 (C++)
        run: make -C periodo-04/algoritmos-1/trabalhos/tp3-centro-de-distribuicao test

      - name: Computação Paralela · leilão (C++ / OpenMP)
        run: make -C optativas/computacao-paralela/trabalhos/leilao-paralelo test CXX=g++

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install networkx numpy matplotlib
      - name: Trabalhos em Python
        env:
          MPLBACKEND: Agg
        run: |
          for dir in periodo-05/algoritmos-2/trabalhos/tp2-caixeiro-viajante \
                     periodo-05/algoritmos-2/trabalhos/envoltoria-convexa \
                     periodo-06/compiladores-1/trabalhos/tp-alocacao-de-registradores \
                     optativas/robotica-movel/trabalhos/tp3-mapa-de-ocupacao; do
            echo "== $dir"; (cd "$dir" && python -m unittest -v)
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Engenharia de Software · BarberFlow (Jest)
        working-directory: periodo-06/engenharia-de-software/trabalhos/barberflow
        run: npm ci && npm test
